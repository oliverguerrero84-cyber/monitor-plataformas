name: Monitoreo plataforma PPDG

# Por qué una corrida larga y no un cron seguido
# ----------------------------------------------
# El cron de GitHub aquí no es de fiar, y está medido: con `*/10` llegaron 2 de
# 30 corridas en 5 horas, y al bajarlo a dos por hora el arranque de las 00:37
# tampoco ocurrió. No hay error ni aviso — los disparos programados en repos con
# poca actividad se descartan en silencio. En la práctica cae uno cada dos o tres
# horas, a capricho.
#
# Así que no se pelea contra eso: se asume. En vez de pedir muchos arranques
# —que es justo lo que GitHub castiga—, cada arranque vigila casi seis horas
# revisando cada 4 minutos. Con que caiga UN disparo en toda la mañana, la
# vigilancia queda continua. Se piden dos por hora nada más para tener muchas
# oportunidades de que alguno entre; los minutos 7 y 37 son a propósito, porque
# en :00 y :30 se amontona medio GitHub.
#
# El límite de GitHub para un job son 6 horas, de ahí el 5h40 del bucle.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué hacer en esta corrida"
        type: choice
        default: revision
        options:
          - revision     # vigilancia normal, casi seis horas
          - prueba       # manda un aviso de prueba y termina
          - simulacro    # ensaya el ciclo completo: caída y recuperación

permissions:
  contents: write

concurrency:
  group: monitor-academia
  # Si un arranque se retrasa y alcanza al anterior, que mande el nuevo. Los
  # avisos ya salieron durante la corrida vieja; no se pierde nada al cortarla.
  cancel-in-progress: true

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install --quiet requests

      - name: Aviso de prueba
        if: github.event.inputs.modo == 'prueba'
        env:
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
        run: python3 monitor/vigilar.py --cliente ppdg --probar

      - name: Simulacro de caída y recuperación
        if: github.event.inputs.modo == 'simulacro'
        env:
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
        run: python3 monitor/vigilar.py --cliente ppdg --simulacro

      - name: Vigilar
        if: github.event_name == 'schedule' || github.event.inputs.modo == 'revision'
        env:
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
        run: |
          set -u
          git config user.name  "monitoreo-ppdg"
          git config user.email "monitoreo@users.noreply.github.com"
          fin=$(( $(date +%s) + 340*60 ))
          hubo_caida=0

          # Marca de arranque. El disparo de GitHub es irregular, así que la
          # única forma de saber si la vigilancia fue continua es dejar rastro de
          # cuándo empezó cada corrida.
          python3 monitor/vigilar.py --cliente ppdg --arranque

          while : ; do
            # El script sale con error cuando detecta una caída. Se anota y se
            # sigue vigilando: lo que hace falta después de una caída es el aviso
            # de que se restableció, y ese solo llega si el bucle continúa.
            python3 monitor/vigilar.py --cliente ppdg || hubo_caida=1

            # El estado solo cambia cuando cambia la situación, así que un commit
            # aquí significa siempre algo real: una caída o una recuperación.
            # Se guarda en el momento, no al final: si la corrida se corta a la
            # mitad, la siguiente tiene que saber que la plataforma estaba caída.
            git add monitor/estado/ 2>/dev/null || true
            if ! git diff --staged --quiet ; then
              git commit -q -m "monitoreo: $(date -u '+%Y-%m-%d %H:%M UTC')"
              git pull -q --rebase --autostash origin ${{ github.ref_name }} || true
              git push -q origin HEAD:${{ github.ref_name }} || true
            fi

            [ "$(date +%s)" -ge "$fin" ] && break
            sleep 240
          done

          # Marcar la corrida como fallida hace que GitHub mande SU propio correo,
          # por un canal independiente del CRM y de GoGHL.
          #
          # Con corridas de seis horas ese correo dejó de ser inmediato: llega
          # cuando termina la corrida, no cuando pasa la falla, y no llega del
          # todo si un disparo nuevo corta esta corrida antes. Vale como rastro
          # de respaldo, no como alerta. La alerta de verdad es la que ya salió
          # por WhatsApp y correo desde el CRM en el momento de la caída.
          if [ "$hubo_caida" = "1" ]; then
            echo "::error::Se detectó al menos una página caída durante esta corrida."
            exit 1
          fi
