name: Monitoreo plataforma PPDG

# Cada 10 minutos. En repos públicos GitHub Actions es gratis e ilimitado, así
# que la cadencia la marca lo que se quiere medir, no el presupuesto: las caídas
# reportadas duraron de 30 minutos a más de una hora, y a 10 minutos ninguna se
# escapa y la duración queda medida fino. GitHub no garantiza puntualidad en los
# cron —bajo carga se retrasa unos minutos— y para este caso da igual.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:          # para poder dispararlo a mano desde la web

# Necesario para que el paso final pueda guardar el estado y el historial.
permissions:
  contents: write

concurrency:
  group: monitor-academia
  cancel-in-progress: false   # que una corrida no mate a la anterior a media revisión

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet requests

      - name: Revisar el sitio
        id: revision
        env:
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
        # `continue-on-error` para que el guardado de abajo SIEMPRE corra: si el
        # script sale con error por una caída, igual queremos conservar el estado.
        continue-on-error: true
        run: python3 monitor/vigilar.py --cliente ppdg

      - name: Guardar estado e historial
        run: |
          git config user.name  "monitoreo-ppdg"
          git config user.email "monitoreo@users.noreply.github.com"
          git add monitor/estado/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "monitoreo: $(date -u '+%Y-%m-%d %H:%M UTC')"
          # La rama avanza sola entre corridas; si otra corrida ya empujó, se rebasa.
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }} || true

      # Hasta aquí ya se avisó por WhatsApp y correo desde el CRM. Este paso hace
      # fallar la corrida a propósito para que GitHub mande SU propio correo:
      # es un segundo canal, independiente del CRM y de GoGHL. Si esa vía se cae,
      # este aviso llega igual.
      - name: Marcar la corrida como fallida si hubo caída
        if: steps.revision.outcome == 'failure'
        run: |
          echo "Se detectó al menos una página caída. Ver el paso 'Revisar el sitio'."
          exit 1
